# ─── Development Override: Hot-Reloading ──────────────────────────────────────
# Extends docker-compose.yml with volume mounts so code changes
# in your editor are reflected instantly inside the containers.
#
# Usage (from the project root):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# How it works:
#   • Backend: nodemon watches /app — any .js file change auto-restarts Express
#   • Frontend: CRA dev server watches /app/src — any component change hot-reloads
#     in the browser at http://localhost:3000 (served by CRA, NOT Nginx in dev mode)

services:
  backend:
    # Override the production CMD to use nodemon for hot-reloading
    command: npx nodemon index.js
    environment:
      - NODE_ENV=development
    volumes:
      # Mount local backend source into the container (live sync)
      - ./InterviewPrep-Backend:/app
      # Preserve container's node_modules (don't overwrite with local empty folder)
      - /app/node_modules

  frontend:
    # Override the production Nginx image to use CRA's dev server
    build:
      context: ./InterviewPrep-Frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001
      - REACT_APP_GOOGLE_CLIENT_ID=371283905078-lkko9r76h4kfo4ftockjatvmff80fs2u.apps.googleusercontent.com
      # Ensures CRA dev server doesn't exit in Docker
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      # Mount local frontend source into the container (live sync)
      - ./InterviewPrep-Frontend:/app
      # Preserve container's node_modules
      - /app/node_modules
