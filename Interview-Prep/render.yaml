# ─── Render Blueprint — deploys both services in one click ────────────────────
# Docs: https://render.com/docs/blueprint-spec
#
# HOW TO USE:
#   1. Push this file to GitHub (already included in repo root)
#   2. Go to https://dashboard.render.com → New → Blueprint
#   3. Connect your GitHub repo → Render auto-detects this file
#   4. After deploy, set the SECRET environment variables in the Render dashboard
#      (see the list of envVarGroups below marked with "sync: false")

services:
  # ── Backend: Node.js / Express ─────────────────────────────────────────────
  - type: web
    name: interviewprep-backend
    runtime: node
    rootDir: Interview-Prep/InterviewPrep-Backend
    buildCommand: npm ci --only=production
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # ── Secrets: set these manually in the Render dashboard ───────────────
      - key: MONGO_URI
        sync: false          # paste your MongoDB Atlas URI in Render dashboard
      - key: JWT_SECRET
        sync: false          # paste your JWT secret in Render dashboard
      - key: GEMINI_API_KEY
        sync: false          # paste your Gemini API key in Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false          # paste your Google Client ID in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      # CLIENT_URL is the Render frontend URL — update after first deploy
      - key: CLIENT_URL
        value: https://interviewprep-frontend.onrender.com
      # ── SMTP (real password-reset emails) ─────────────────────────────────
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: mohitjatav326@gmail.com
      - key: SMTP_PASS
        sync: false          # paste your Gmail App Password in Render dashboard
      - key: MAIL_FROM
        value: "InterviewPrep <mohitjatav326@gmail.com>"

  # ── Frontend: React (Static Site) ──────────────────────────────────────────
  - type: web
    name: interviewprep-frontend
    runtime: static
    rootDir: Interview-Prep/InterviewPrep-Frontend
    buildCommand: npm ci; npm run build
    staticPublishPath: build
    envVars:
      # Backend URL — update to match your actual backend Render URL after deploy
      - key: REACT_APP_API_URL
        value: https://interviewprep-backend.onrender.com
      - key: REACT_APP_GOOGLE_CLIENT_ID
        sync: false          # paste your Google Client ID in Render dashboard
    routes:
      # Send all routes to index.html so React Router works correctly
      - type: rewrite
        source: /*
        destination: /index.html
